name: url-shortener

services:
  app:
    build: .
    environment: &app-env
      HOST: 0.0.0.0
      PORT: "3100"
      DATABASE_URL: postgresql://shortener:shortener@postgres:5432/shortener
      VALKEY_URL: redis://valkey:6379
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
  npm:
    profiles: [tools]
    build:
      context: .
      target: tools
    entrypoint: ["npm"]
    command: ["help"]
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql://shortener:shortener@postgres:5432/shortener
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-links.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shortener", "-d", "shortener"]
      interval: 1s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:9.1.4
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10

volumes:
  postgres-data:
  node_modules:
