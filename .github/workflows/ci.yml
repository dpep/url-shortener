name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite == 'mixed' && 'Mixed-version redirects' || 'Service tests' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [service, mixed]
        event: ["${{ github.event_name }}"]
        exclude:
          - suite: mixed
            event: push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      valkey:
        image: valkey/valkey:9.1.4
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 10
    env:
      VALKEY_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        if: matrix.suite == 'service'
      - name: Check out the PR base
        if: matrix.suite == 'mixed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
          persist-credentials: false
      - run: npm ci --omit=dev --prefix .baseline
        if: matrix.suite == 'mixed'
      - run: npm run test:mixed
        if: matrix.suite == 'mixed'
        env:
          BASELINE_DIR: .baseline
